<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniPixel</title><style>body{margin:0;background:#10121b;color:#f5f5fa;font:15px system-ui}header{padding:24px;background:#191d2a}main{max-width:1050px;margin:25px auto;padding:0 16px}.search{display:flex;gap:10px}input,button{padding:12px;border:0;border-radius:9px}input{flex:1;min-width:0;background:#252a3a;color:white}button{background:#a78bfa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.card{background:#191d2a;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:3/4;object-fit:cover}.card div{padding:10px}.muted,#status{color:#9aa3b8;font-size:12px}</style></head><body><header><h1>AniPixel</h1><p>Discover anime powered by AniList</p></header><main><form class="search" id="form"><input id="q" placeholder="Search anime..." minlength="2" required><button>Search</button></form><p id="status">Loading…</p><div id="content"></div></main><script>
const $=s=>document.querySelector(s),content=$("#content"),status=$("#status");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function section(name,items){let cards=(items||[]).map(x=>'<article class="card"><img loading="lazy" src="'+esc(x.coverImage?.large||'')+'"><div><b>'+esc(x.title?.english||x.title?.romaji||'Untitled')+'</b><p class="muted">'+esc(x.status||'')+(x.averageScore?' · '+x.averageScore+'%':'')+'</p></div></article>').join('');return '<h2>'+esc(name)+'</h2><div class="grid">'+cards+'</div>'}
async function load(url){status.textContent='Loading…';try{let r=await fetch(url),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');status.textContent='';return d}catch(e){status.textContent=e.message;return null}}
(async()=>{let d=await load('/api/home');if(d)content.innerHTML=section('Currently Airing',d.airing)+section('This Season',d.season)+section('Top Rated',d.top)})();$('#form').addEventListener('submit',async e=>{e.preventDefault();let d=await load('/api/search?q='+encodeURIComponent($('#q').value));if(d)content.innerHTML=section('Search Results',d.media)});
</script></main></body></html>
